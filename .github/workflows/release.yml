name: Release

# Push a tag like v0.1.0: every platform is built, then one job gathers the
# files into a single draft release (parallel uploads would race and create
# duplicate drafts).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            app/release/*.exe
            app/release/*.dmg
            app/release/*.AppImage
            app/release/*.deb

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        working-directory: app
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest golang.org/x/mobile/cmd/gobind@latest
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm ci
          gomobile init
          node scripts/mobile.mjs core android
          node scripts/mobile.mjs web
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../Termward-${GITHUB_REF_NAME#v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: app/Termward-*.apk

  ios:
    name: iOS (unsigned IPA for SideStore / AltStore)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build IPA
        working-directory: app
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest golang.org/x/mobile/cmd/gobind@latest
          npm ci
          gomobile init
          node scripts/mobile.mjs core ios
          node scripts/mobile.mjs web
          sh scripts/ios-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          if-no-files-found: error
          path: app/ios/App/build/Termward-*.ipa

  release:
    name: Draft release
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
