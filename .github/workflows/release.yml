name: Release

# Push a tag like v0.1.0 to build installers and attach them to a draft release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            app/release/*.exe
            app/release/*.dmg
            app/release/*.AppImage
            app/release/*.deb

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        working-directory: app
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest golang.org/x/mobile/cmd/gobind@latest
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm ci
          gomobile init
          node scripts/mobile.mjs core android
          node scripts/mobile.mjs web
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../termward-${GITHUB_REF_NAME#v}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: app/termward-*.apk
