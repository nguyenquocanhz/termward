name: Mobile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest golang.org/x/mobile/cmd/gobind@latest
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Build
        working-directory: app
        run: |
          npm ci
          gomobile init
          node scripts/mobile.mjs core android
          node scripts/mobile.mjs web
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: termward-android-debug
          path: app/android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS (simulator build + unsigned IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install gomobile
        run: go install golang.org/x/mobile/cmd/gomobile@latest golang.org/x/mobile/cmd/gobind@latest
      - name: Build
        working-directory: app
        run: |
          npm ci
          gomobile init
          node scripts/mobile.mjs core ios
          node scripts/mobile.mjs web
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/App/build CODE_SIGNING_ALLOWED=NO build
      - name: Unsigned IPA (for SideStore / AltStore)
        working-directory: app
        run: sh scripts/ios-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: termward-ios-unsigned-ipa
          path: app/ios/App/build/Termward-*.ipa
